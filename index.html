
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رسائل حب</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:Arial;
    background:#111;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
}

.header{
    margin-top:40px;
    font-size:38px;
    font-weight:bold;
}

.sub{
    color:#bbb;
    margin-top:10px;
    margin-bottom:40px;
}

.container{
    width:90%;
    max-width:1000px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
}

.card{
    background:#1b1b1b;
    border:2px solid #fff;
    border-radius:20px;
    padding:30px 20px;
    text-align:center;
    cursor:pointer;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
    background:#fff;
    color:#000;
}

.icon{
    font-size:50px;
    margin-bottom:15px;
}

.messageBox{
    margin-top:40px;
    background:#1b1b1b;
    border:2px solid #fff;
    border-radius:20px;
    width:80%;
    max-width:700px;
    padding:30px;
    text-align:center;
    display:none;
    animation:fade 0.4s ease;
}

.message{
    font-size:28px;
    margin-bottom:25px;
    line-height:1.8;
}

.signature{
    font-size:18px;
    color:#bbb;
}

@keyframes fade{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
}

.heart{
    position:fixed;
    bottom:-20px;
    font-size:20px;
    animation:floatUp 6s linear forwards;
    opacity:0.8;
    pointer-events:none;
}

@keyframes floatUp{
    0%{
        transform:translateY(0) rotate(0deg);
        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }
}

</style>
</head>

<body>

<div class="header">
💌 رسائل خاصة 💌
</div>

<div class="sub">
اضغطي على أي رسالة يايمنى ❤️
</div>

<div class="container">

<div class="card" onclick="showMessage('بحبك يا يمنتي ❤️')">
    <div class="icon">💌</div>
    رسالة 1
</div>

<div class="card" onclick="showMessage('بحبك يا يمنتي جدًا 🌹')">
    <div class="icon">❤️</div>
    رسالة 2
</div>

<div class="card" onclick="showMessage('يا يمنتي وجودك أجمل حاجة في الدنيا ✨')">
    <div class="icon">🌹</div>
    رسالة 3
</div>

<div class="card" onclick="showMessage('كل مرة بشوفك بحبك أكتر 💖')">
    <div class="icon">💖</div>
    رسالة 4
</div>

<div class="card" onclick="showMessage('بحبك يا يمنتي للأبد 🤍')">
    <div class="icon">🤍</div>
    رسالة 5
</div>

<div class="card" onclick="showMessage('أنتِ أجمل تفاصيل أيامي 🌸')">
    <div class="icon">🌸</div>
    رسالة 6
</div>

</div>

<div class="messageBox" id="messageBox">

<div class="message" id="messageText"></div>

<div class="signature">
Ahmed Abdulwahab
</div>

</div>

<script>

function showMessage(text){

    document.getElementById('messageBox').style.display='block';
    document.getElementById('messageText').innerText=text;

}

function createHeart(){

    const heart=document.createElement('div');

    heart.classList.add('heart');
    heart.innerHTML='❤️';

    heart.style.left=Math.random()*100+'vw';
    heart.style.fontSize=(15 + Math.random()*25)+'px';
    heart.style.animationDuration=(4 + Math.random()*3)+'s';

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },7000);

}

setInterval(createHeart,400);

</script>

</body>
</html>
