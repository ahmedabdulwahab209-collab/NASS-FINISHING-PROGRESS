
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رسائل حب</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:Arial;
    background:#111;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
}

.header{
    margin-top:40px;
    font-size:38px;
    font-weight:bold;
}

.sub{
    color:#bbb;
    margin-top:10px;
    margin-bottom:40px;
}

.container{
    width:90%;
    max-width:1000px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
}

.card{
    background:#1b1b1b;
    border:2px solid #fff;
    border-radius:20px;
    padding:30px 20px;
    text-align:center;
    cursor:pointer;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px) scale(1.03);
    background:#fff;
    color:#000;
}

.icon{
    font-size:50px;
    margin-bottom:15px;
}

.heart{
    position:fixed;
    bottom:-20px;
    font-size:20px;
    animation:floatUp 6s linear forwards;
    opacity:0.8;
    pointer-events:none;
}

@keyframes floatUp{

    0%{
        transform:translateY(0) rotate(0deg);
        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }

}

</style>
</head>

<body>

<div class="header">
💌 رسائل إليكي 💌
</div>

<div class="sub">
اضغطي على أي رسالة يايمنى ❤️
</div>

<div class="container">

<div class="card" onclick="explode(event,'بحبك يا يمنتي ❤️')">
    <div class="icon">💌</div>
    رسالة 1
</div>

<div class="card" onclick="explode(event,'حبيب عينيا حبيب أيامي🌹')">
    <div class="icon">❤️</div>
    رسالة 2
</div>

<div class="card" onclick="explode(event,'يا يمنتي وجودك أجمل حاجة في الدنيا ✨')">
    <div class="icon">🌹</div>
    رسالة 3
</div>

<div class="card" onclick="explode(event,'كل مرة بشوفك بحبك أكتر 💖')">
    <div class="icon">💖</div>
    رسالة 4
</div>

<div class="card" onclick="explode(event,'بحبك يا يمنتي للأبد 🤍')">
    <div class="icon">🤍</div>
    رسالة 5
</div>

<div class="card" onclick="explode(event,'أنتِ أجمل تفاصيل أيامي 🌸')">
    <div class="icon">🌸</div>
    رسالة 6
</div>

</div>

<script>

function createHeart(){

    const heart=document.createElement('div');

    heart.classList.add('heart');

    heart.innerHTML='❤️';

    heart.style.left=Math.random()*100+'vw';

    heart.style.fontSize=(15 + Math.random()*25)+'px';

    heart.style.animationDuration=(4 + Math.random()*3)+'s';

    document.body.appendChild(heart);

    setTimeout(()=>{

        heart.remove();

    },7000);

}

function explode(event,text){

    const boom=document.createElement('div');

    boom.innerText=text;

    boom.style.position='fixed';

    boom.style.left=event.clientX+'px';

    boom.style.top=event.clientY+'px';

    boom.style.transform='translate(-50%,-50%) scale(0.5)';

    boom.style.fontSize='55px';

    boom.style.fontWeight='900';

    boom.style.color='#ffffff';

    boom.style.textShadow='0 0 10px #ff4d6d, 0 0 20px #ff4d6d, 0 0 40px #ff4d6d';

    boom.style.background='rgba(0,0,0,0.45)';

    boom.style.padding='15px 25px';

    boom.style.borderRadius='20px';

    boom.style.backdropFilter='blur(5px)';

    boom.style.zIndex='9999';

    boom.style.pointerEvents='none';

    boom.style.transition='1s';

    document.body.appendChild(boom);

    setTimeout(()=>{

        boom.style.transform='translate(-50%,-120%) scale(1.4)';

        boom.style.opacity='0';

    },50);

    for(let i=0;i<20;i++){

        const heart=document.createElement('div');

        heart.innerHTML='❤️';

        heart.style.position='fixed';

        heart.style.left=event.clientX+'px';

        heart.style.top=event.clientY+'px';

        heart.style.fontSize=(15+Math.random()*20)+'px';

        heart.style.pointerEvents='none';

        heart.style.transition='1s';

        heart.style.zIndex='9999';

        document.body.appendChild(heart);

        const x=(Math.random()-0.5)*400;

        const y=(Math.random()-0.5)*400;

        setTimeout(()=>{

            heart.style.transform=`translate(${x}px,${y}px) scale(0)`;

            heart.style.opacity='0';

        },20);

        setTimeout(()=>{

            heart.remove();

        },1000);

    }

    setTimeout(()=>{

        boom.remove();

    },12000);

}

setInterval(createHeart,400);

</script>

</body>
</html>
