
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مكرميات للبيع</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f5f1eb;
    color:#333;
}

.header{
    background:#8b5e3c;
    color:#fff;
    padding:25px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:42px;
}

.header p{
    margin-top:10px;
    color:#f1e3d3;
}

.container{
    width:90%;
    margin:auto;
    margin-top:40px;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.card{
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:300px;
    object-fit:cover;
}

.content{
    padding:20px;
}

.title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:10px;
}

.desc{
    color:#666;
    margin-bottom:15px;
    line-height:1.7;
}

.price{
    font-size:26px;
    color:#8b5e3c;
    font-weight:bold;
    margin-bottom:15px;
}

.btn{
    display:block;
    width:100%;
    border:none;
    background:#8b5e3c;
    color:#fff;
    padding:14px;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:#6f472b;
}

.footer{
    margin-top:50px;
    background:#8b5e3c;
    color:#fff;
    text-align:center;
    padding:25px;
}

.phone{
    font-size:26px;
    margin-top:10px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="header">

<h1>
Yomna Macramé Studio</h1>

<p>
أجمل تصميمات المكرميات بأفضل الأسعار
</p>

</div>

<div class="container">

<!-- منتج 1 -->
<div class="card">

<img src="صورة" alt="">

<div class="content">

<div class="title">
هنضيف صور ونشوف لسه 
</div>

<div class="desc">
مكرمية ديكور مودرن مصنوعة يدويًا بخامات عالية الجودة
</div>

<div class="price">
250 جنيه
</div>

<button class="btn">
اطلب الآن
</button>

</div>

</div>

<!-- منتج 2 -->
<div class="card">

<img src="image1.jpg.jpeg" alt="">

<div class="content">

<div class="title">
مكرمية ستارة هاند مايد
</div>

<div class="desc">
ستارة ستأخذك إلى عالم آخر
</div>

<div class="price">
699 جنيه
</div>

<button class="btn">
اطلب الآن
</button>

</div>

</div>

<!-- منتج 3 -->
<div class="card">

<img src="صورة" alt="">

<div class="content">

<div class="title">
مكرمية مرآة
</div>

<div class="desc">
ديكور مرآة مميز بتصميم جذاب
</div>

<div class="price">
320 جنيه
</div>

<button class="btn">
اطلب الآن
</button>

</div>

</div>

</div>

<div class="footer">

<div>
للتواصل وطلب الأوردرات
</div>

<div class="phone">
📞 01062164254
</div>

</div>

</body>
</html>
